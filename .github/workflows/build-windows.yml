name: Windows 빌드

# PyInstaller는 크로스 컴파일이 안 돼서(빌드한 OS용 바이너리만 생성) 윈도우용
# 실행 파일은 실제 윈도우 환경에서 만들어야 한다. 여기서는 GitHub이 호스팅하는
# 윈도우 러너를 빌려서 빌드하므로, 직접 윈도우 PC를 갖고 있지 않아도 된다.
on:
  workflow_dispatch:   # Actions 탭에서 수동 실행
  push:
    tags:
      - "v*"            # v1.0.0 같은 태그를 push하면 자동 실행

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 빌드
        run: pyinstaller dms_labeling.spec

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dms_labeling-windows
          path: |
            dist/dms_labeling.exe
            DMS_Actions.xlsx
