name: Windows 빌드

# PyInstaller는 크로스 컴파일이 안 돼서(빌드한 OS용 바이너리만 생성) 윈도우용
# 실행 파일은 실제 윈도우 환경에서 만들어야 한다. 여기서는 GitHub이 호스팅하는
# 윈도우 러너를 빌려서 빌드하므로, 직접 윈도우 PC를 갖고 있지 않아도 된다.
on:
  workflow_dispatch:   # Actions 탭에서 수동 실행
  push:
    tags:
      - "v*"            # v1.0.0 같은 태그를 push하면 자동 실행

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller 빌드
        run: pyinstaller dms_labeling.spec

      - name: DMS_Actions.xlsx를 실행 파일과 같은 폴더로 이동
        # actions/upload-artifact는 지정한 경로들을 리포지토리 루트 기준
        # 구조 그대로 보존한다 - dist/dms_labeling.exe와 루트의
        # DMS_Actions.xlsx를 그냥 나열하면 압축 해제 시 서로 다른 폴더에
        # 떨어져서, run_app.py의 xlsx 자동 탐색(실행 파일과 같은 폴더 우선)이
        # 안 먹힌다. dist/ 안으로 미리 복사해서 아티팩트 자체가 이미 배포
        # 가능한 한 폴더 구조가 되게 한다.
        shell: bash
        run: cp DMS_Actions.xlsx dist/

      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dms_labeling-windows
          path: dist/
